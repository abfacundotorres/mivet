<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mivet/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiVet</title>
    <link rel="stylesheet" href="https://db.onlinewebfonts.com/c/5ac3fe7c6abd2f62067f266d89671492?family=HelveticaNowDisplay-Medium" />
    <link rel="stylesheet" href="https://db.onlinewebfonts.com/c/1aa3377e489837a26d019bba501e779d?family=HelveticaNowDisplayW01-Rg" />
    <script type="module" crossorigin src="/mivet/assets/index-D-OGydq-.js"></script>
    <link rel="stylesheet" crossorigin href="/mivet/assets/index-C83f0nfL.css">
    <!-- Sin overrides de overflow: las secciones de servicios y equipo ahora
         viven en páginas separadas (servicios.html, equipo.html), así que
         el hero vuelve a comportarse exactamente como el original: pantalla
         fija, sin competir nunca con scroll de contenido debajo. -->
  </head>
  <body>
    <div id="root"></div>

    <script>
      // El hero (React) trae los botones "Consultar por WhatsApp",
      // "Sacar un turno", "Conocer al equipo" y "Ver nuestros servicios".
      // "Servicios" y "Equipo" ahora navegan a páginas propias en vez de
      // hacer scroll en la misma pantalla (así el hero nunca convive con
      // contenido scrolleable, y el gesto de arrastre del gato queda
      // 100% libre en todas las plataformas).
      (function () {
        var WHATSAPP_NUMBER = "5493525616457";
        var CONSULTA_URL =
          "https://wa.me/" +
          WHATSAPP_NUMBER +
          "?text=Hola!%20Quiero%20consultar%20por%20mi%20mascota";
        var TURNO_URL =
          "https://wa.me/" +
          WHATSAPP_NUMBER +
          "?text=Hola!%20Quiero%20consultar%20disponibilidad%20para%20sacar%20un%20turno";

        document.addEventListener("click", function (event) {
          var button = event.target.closest("button");
          if (!button) return;
          var label = button.textContent.trim();

          if (label.indexOf("Consultar por WhatsApp") !== -1) {
            window.open(CONSULTA_URL, "_blank", "noopener");
          } else if (label.indexOf("Sacar un turno") !== -1) {
            window.open(TURNO_URL, "_blank", "noopener");
          } else if (label.indexOf("Conocer al equipo") !== -1) {
            window.location.href = "/mivet/equipo.html";
          } else if (label.indexOf("Ver nuestros servicios") !== -1) {
            window.location.href = "/mivet/servicios.html";
          }
        });
      })();
    </script>
  </body>
</html>
